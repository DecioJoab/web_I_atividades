<!-- O enctype é essencial para envio de arquivos -->
<form action="salvar_paciente.php" method="POST" enctype="multipart/form-data">
    <label for="nome">Nome do Paciente:</label>
    <input type="text" name="nome" id="nome" required>

    <!-- Campo de upload da imagem -->
    <label for="foto">Foto de Perfil:</label>
    <input type="file" name="foto" id="foto" accept="image/*">

    <!-- Seus campos do relacionamento N-N (ex: médicos, especialidades) continuam aqui -->
    
    <button type="submit">Salvar Paciente</button>
</form>
